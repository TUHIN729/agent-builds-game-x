<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Dodger — one prompt, one game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050510; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    color: #7df9ff; font: 14px/1.4 "Courier New", monospace; letter-spacing: 2px;
    text-shadow: 0 0 8px #00e5ff; pointer-events: none; opacity: .85;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hint">ARROWS / WASD TO FLY &nbsp;·&nbsp; DODGE THE ROCKS &nbsp;·&nbsp; GRAB THE STARS &nbsp;·&nbsp; R TO RESTART</div>
<script>
"use strict";
/* Neon Dodger — a tiny browser game built from one prompt:
   "Build a tiny browser game: a neon asteroid-dodger — pilot a little ship,
   dodge the rocks, grab the stars, watch the score climb. One HTML file,
   keyboard to fly." */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// --- tiny deterministic RNG so a run can be replayed ---
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32((Math.random() * 1e9) | 0);

const keys = {};
window.addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === "r" || e.key === "R") reset();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
});
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

// Pointer drag also flies the ship (phones welcome).
let pointer = null;
canvas.addEventListener("pointerdown", (e) => { pointer = { x: e.clientX, y: e.clientY }; });
window.addEventListener("pointermove", (e) => { if (pointer) pointer = { x: e.clientX, y: e.clientY }; });
window.addEventListener("pointerup", () => { pointer = null; });

const ship = { x: 0, y: 0, vx: 0, vy: 0, r: 16, alive: true };
let asteroids = [], stars = [], particles = [], bgStars = [];
let score = 0, lives = 3, level = 1, elapsed = 0, spawnTimer = 0, starTimer = 0;
let over = false, flash = 0;

function initBg() {
  bgStars = [];
  for (let i = 0; i < 140; i++) {
    bgStars.push({ x: rand() * W, y: rand() * H, r: rand() * 1.8 + 0.4, tw: rand() * Math.PI * 2, sp: 0.2 + rand() * 0.8 });
  }
}
function reset() {
  ship.x = W / 2; ship.y = H * 0.78; ship.vx = 0; ship.vy = 0; ship.alive = true;
  asteroids = []; stars = []; particles = [];
  score = 0; lives = 3; level = 1; elapsed = 0; spawnTimer = 0; starTimer = 0;
  over = false; flash = 0;
  initBg();
}
reset();

function spawnAsteroid() {
  const r = 14 + rand() * 34;
  const verts = [];
  const n = 7 + Math.floor(rand() * 4);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    verts.push({ a, d: r * (0.72 + rand() * 0.5) });
  }
  asteroids.push({
    x: r + rand() * (W - 2 * r), y: -r - 10,
    r, verts, rot: rand() * Math.PI * 2, vr: (rand() - 0.5) * 1.6,
    vy: 90 + rand() * 90 + level * 14, vx: (rand() - 0.5) * 40,
    hue: rand() < 0.5 ? "#ff2d78" : "#ff9f1c",
  });
}
function spawnStar() {
  stars.push({
    x: 30 + rand() * (W - 60), y: -20,
    r: 11, vy: 120 + rand() * 60, rot: 0, vr: 1.2, taken: false,
  });
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand() * Math.PI * 2, s = 60 + rand() * 220;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + rand() * 0.5, t: 0, color, r: 1.5 + rand() * 2.5 });
  }
}
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }

function update(dt) {
  elapsed += dt;
  level = 1 + Math.floor(score / 400);
  flash = Math.max(0, flash - dt * 2);

  // --- ship steering ---
  const ACC = 2400, MAXV = 460;
  let ax = 0, ay = 0;
  if (keys["arrowleft"] || keys["a"]) ax -= 1;
  if (keys["arrowright"] || keys["d"]) ax += 1;
  if (keys["arrowup"] || keys["w"]) ay -= 1;
  if (keys["arrowdown"] || keys["s"]) ay += 1;
  if (pointer) {
    const dx = pointer.x - ship.x, dy = pointer.y - ship.y;
    if (Math.hypot(dx, dy) > 8) { ax = dx / 60; ay = dy / 60; }
  }
  const len = Math.hypot(ax, ay) || 1;
  ship.vx += (ax / len) * ACC * dt;
  ship.vy += (ay / len) * ACC * dt;
  ship.vx *= Math.pow(0.12, dt); ship.vy *= Math.pow(0.12, dt);
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp > MAXV) { ship.vx *= MAXV / sp; ship.vy *= MAXV / sp; }
  ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x + ship.vx * dt));
  ship.y = Math.max(ship.r, Math.min(H - ship.r, ship.y + ship.vy * dt));

  // --- spawns ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnAsteroid(); spawnTimer = Math.max(0.22, 0.85 - level * 0.06) * (0.7 + rand() * 0.6); }
  starTimer -= dt;
  if (starTimer <= 0) { spawnStar(); starTimer = 1.1 + rand() * 1.4; }

  // --- asteroids ---
  for (const a of asteroids) {
    a.y += a.vy * dt; a.x += a.vx * dt; a.rot += a.vr * dt;
    if (ship.alive && dist(a, ship) < a.r * 0.82 + ship.r * 0.7) {
      lives -= 1; flash = 1;
      burst(ship.x, ship.y, "#00e5ff", 26);
      burst(a.x, a.y, a.hue, 18);
      a.y = H + 999; // remove the rock that hit
      if (lives <= 0) { ship.alive = false; over = true; burst(ship.x, ship.y, "#ffffff", 60); }
      else { ship.x = W / 2; ship.y = H * 0.78; ship.vx = 0; ship.vy = 0; }
    }
  }
  asteroids = asteroids.filter((a) => a.y - a.r < H + 40);

  // --- stars ---
  for (const s of stars) {
    s.y += s.vy * dt; s.rot += s.vr * dt;
    if (ship.alive && !s.taken && dist(s, ship) < s.r + ship.r + 6) {
      s.taken = true; score += 50;
      burst(s.x, s.y, "#ffd319", 14);
    }
  }
  stars = stars.filter((s) => !s.taken && s.y < H + 30);

  // --- particles & background ---
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; }
  particles = particles.filter((p) => p.t < p.life);
  for (const b of bgStars) { b.tw += dt * b.sp; b.y += 12 * dt; if (b.y > H) { b.y = -2; b.x = rand() * W; } }

  if (ship.alive) score += dt * 10; // survival points — the score climbs
}

function drawGlowCircle(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}
function drawShip() {
  if (!ship.alive) return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  const tilt = Math.max(-0.4, Math.min(0.4, ship.vx / 900));
  ctx.rotate(tilt);
  // engine flame
  const fl = 14 + Math.random() * 12;
  ctx.shadowColor = "#ff9f1c"; ctx.shadowBlur = 18;
  ctx.fillStyle = "#ffb347";
  ctx.beginPath(); ctx.moveTo(-6, 14); ctx.lineTo(0, 14 + fl); ctx.lineTo(6, 14); ctx.closePath(); ctx.fill();
  // hull
  ctx.shadowColor = "#00e5ff"; ctx.shadowBlur = 22;
  ctx.fillStyle = "#0ff";
  ctx.strokeStyle = "#e6ffff"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(14, 14); ctx.lineTo(5, 8); ctx.lineTo(-5, 8); ctx.lineTo(-14, 14);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#050510";
  ctx.beginPath(); ctx.arc(0, -2, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y); ctx.rotate(a.rot);
  drawGlowCircle(0, 0, a.r * 1.9, a.hue === "#ff2d78" ? "rgba(255,45,120,0.16)" : "rgba(255,159,28,0.16)");
  ctx.shadowColor = a.hue; ctx.shadowBlur = 16;
  ctx.strokeStyle = a.hue; ctx.lineWidth = 2.5; ctx.fillStyle = "rgba(20,8,24,0.9)";
  ctx.beginPath();
  a.verts.forEach((v, i) => {
    const x = Math.cos(v.a) * v.d, y = Math.sin(v.a) * v.d;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = a.hue; ctx.globalAlpha = 0.5;
  ctx.beginPath(); ctx.arc(-a.r * 0.25, -a.r * 0.2, a.r * 0.14, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(a.r * 0.3, a.r * 0.3, a.r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawStar4(x, y, r, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.22, -r * 0.22, r, 0);
  ctx.quadraticCurveTo(r * 0.22, r * 0.22, 0, r);
  ctx.quadraticCurveTo(-r * 0.22, r * 0.22, -r, 0);
  ctx.quadraticCurveTo(-r * 0.22, -r * 0.22, 0, -r);
  ctx.fill();
  ctx.restore();
}
function drawText(str, x, y, size, color, align, glow) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 16; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function draw() {
  // space gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0a0620"); g.addColorStop(0.55, "#050510"); g.addColorStop(1, "#12041f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const b of bgStars) {
    ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(b.tw));
    ctx.fillStyle = "#cfe9ff";
    ctx.fillRect(b.x, b.y, b.r, b.r);
  }
  ctx.globalAlpha = 1;

  for (const s of stars) drawStar4(s.x, s.y, s.r, s.rot, "#ffd319");
  for (const a of asteroids) drawAsteroid(a);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawShip();

  // HUD
  drawText("SCORE  " + Math.floor(score), 18, 16, Math.max(22, W * 0.028), "#7df9ff", "left", true);
  drawText("LEVEL " + level, W - 18, 16, Math.max(22, W * 0.028), "#ff2d78", "right", true);
  const hearts = "♥ ".repeat(Math.max(0, lives)) + "♡ ".repeat(Math.max(0, 3 - lives));
  drawText(hearts.trim(), 18, 52, 22, "#ff5c8a", "left", true);
  drawText("NEON DODGER", W / 2, H - 44, 15, "#8f7bff", "center", false);

  if (over) {
    ctx.fillStyle = "rgba(5,5,16,0.72)"; ctx.fillRect(0, 0, W, H);
    drawText("GAME OVER", W / 2, H * 0.36, Math.max(44, W * 0.07), "#ff2d78", "center", true);
    drawText("FINAL SCORE  " + Math.floor(score), W / 2, H * 0.36 + 70, 26, "#ffd319", "center", true);
    drawText("PRESS R TO FLY AGAIN", W / 2, H * 0.36 + 120, 20, "#7df9ff", "center", true);
  }
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,45,120,${flash * 0.25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!over) update(dt);
  else { for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; } }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
